linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

issues:
  exclude-dirs:
    # Examples are not production code. Their root-module imports can trigger
    # intermittent typecheck-cache false positives and are outside the SDK/CLI deliverables.
    - examples
  skip-dirs:
    - examples
  exclude-rules:
    # Examples are not production code. Typecheck can occasionally report false positives
    # for root-module imports when Go versions are mismatched; examples are not SDK/CLI deliverables.
    - path: examples
      linters:
        - typecheck
    # assertHarErrorCode is a test assertion helper. Its *HarError return value is only
    # used for optional chained assertions; t.Fatalf already stops the test on failure,
    # so ignoring the return value is safe.
    - path: _test\.go
      linters:
        - errcheck
      source: "assertHarErrorCode\\("
    # File permission and removal calls are common in test cleanup; their return values
    # do not affect the test outcome.
    - path: _test\.go
      linters:
        - errcheck
      source: "os\\.(Chmod|Chdir|Remove|RemoveAll)\\("
